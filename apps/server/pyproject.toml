[project]
name = "bingo-server"
version = "0.1.0"
description = "Local-first backend for the Bingo personal assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20,<1",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "openai>=2.0,<3",
    "pydantic>=2.10,<3",
    "PyYAML>=6,<7",
    "redis>=5.2,<7",
    "sqlmodel>=0.0.24,<1",
    "tzdata>=2025.2",
    "uvicorn[standard]>=0.34,<1",
    "websockets>=15,<18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
include = ["bingo*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
