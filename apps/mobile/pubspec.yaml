name: bingo
description: Local-first Android client for the Bingo personal assistant.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  image_path: assets/images/bingo_logo.png
  adaptive_icon_background: "#EAFBF6"
  adaptive_icon_foreground: assets/images/bingo_logo.png
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 23
