-weight:600}.auth-switch button[aria-pressed="true"]:after{content:"";position:absolute;bottom:0;left:0;width:18px;height:3px;border-radius:2px;background:var(--accent)}.field{display:flex;align-items:center;gap:9px;border:1px solid #e5ede6;background:#ffffffed;border-radius:17px;padding:0 13px;min-height:49px;margin:12px 0}.field svg{color:#9bb3a1;width:18px;height:18px}.field span{font-size:11px;color:#617d6b;padding-right:9px;border-right:1px solid #e4ece4}.field input{width:100%;min-width:0;outline:none;border:0;background:transparent;font-size:12px;color:#4f6c59}.field input::placeholder{color:#a5b4a9}.field:focus-within{border-color:#abc9b6}.text-action{border:0;background:transparent;color:var(--accent);font-size:10px;padding:8px 0}.forgot{display:block;margin:0 0 19px auto}.primary{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:47px;border-radius:17px;border:1px solid var(--button-border);background:var(--button-fill);box-shadow:var(--button-shadow);color:var(--button-ink);font-size:14px;font-weight:600;letter-spacing:.3px}.primary svg{width:19px;height:19px}.primary:hover{filter:brightness(.985)}.terms{display:flex;justify-content:center;align-items:center;gap:6px;margin-top:20px;font-size:9px;color:#869a8b;white-space:nowrap}.terms input{accent-color:var(--accent);width:13px;height:13px;flex-shrink:0;margin:0}.terms a{color:var(--accent);text-decoration:none;font-weight:600}.auth-note{text-align:center;margin-top:46px;color:#a4b4a8;font-size:10px;line-height:2}.mini-line{display:inline-block;width:14px;height:1px;background:#d5e1d8;margin:0 7px;vertical-align:middle}.card{border-radius:24px;background:white;padding:15px 12px;margin-bottom:12px}.card-main{display:flex;align-items:center;gap:11px}.avatar{width:59px;height:59px;border-radius:50%;object-fit:cover;flex-shrink:0}.info{flex:1;min-width:0}.card-heading{display:flex;align-items:center;justify-content:space-between;gap:7px}.card-heading h3{font-size:17px;font-weight:600;margin:0}.enter-wrap{position:relative}.enter{display:flex;align-items:center;gap:5px;background:var(--small-fill);border:1px solid var(--small-border);color:var(--accent);border-radius:18px;font-size:10px;padding:7px 10px}.enter svg{width:13px;height:13px}.unread{position:absolute;top:-6px;right:-4px;min-width:18px;height:18px;padding:0 4px;display:grid;place-items:center;color:#fff;border:2px solid white;border-radius:12px;background:#f46478;font-size:9px}.subtitle{font-size:10px;color:#93a698;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:6px 0 0;line-height:1.6}.traits{display:flex;gap:6px;flex-wrap:wrap;margin-top:13px}.trait{display:flex;align-items:center;gap:4px;border-radius:16px;padding:5px 7px;background:#f0f7f2;color:#7d9686;font-size:9px}.trait svg{width:12px;height:12px;color:#69a28c}.trait.heart svg{color:#ed9fba;fill:currentColor;stroke:none}.trait.star svg{color:#debd61;fill:currentColor;stroke:none}.trait.coffee svg{color:#af9f91}.bottom{position:absolute;left:0;right:0;bottom:0;padding:22px 18px;background:linear-gradient(transparent,#f8fbf8 26%)}.bottom .primary{border-radius:25px}.panel{padding:17px;background:#fff;border:1px solid #edf2ed;border-radius:22px;margin-top:13px}.panel h3{display:flex;align-items:center;gap:8px;margin:0 0 13px;font-size:13px;font-weight:600}.panel h3 svg{width:17px;height:17px;color:#75a28a}.input-preview{padding:11px;border-radius:12px;background:#f7faf7;color:#99ada0;font-size:11px;line-height:1.8}.create-intro{text-align:center;padding:9px 0 8px}.avatar-upload{width:77px;height:77px;border-radius:50%;position:relative;border:0;padding:0;background:transparent}.avatar-upload img{width:77px;height:77px;border-radius:50%;object-fit:cover}.camera{position:absolute;right:-2px;bottom:-1px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#ddf2e7;color:#4f8067;border:3px solid #f8fbf8}.camera svg{width:13px;height:13px}.avatar-caption{font-size:10px;color:#4f8067;display:block;margin:10px 0 16px}.create-intro h3{font-size:17px;font-weight:600;margin:0 0 7px}.create-intro p{font-size:10px;color:#99aea0;line-height:1.8;margin:0}.voice-tabs{display:flex;gap:5px;padding:4px;background:#f2f7f3;border-radius:12px;font-size:10px;color:#92a596}.voice-tabs span{flex:1;text-align:center;padding:7px;border-radius:9px}.voice-tabs .active{background:#fff;color:var(--accent)}.voice-select{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding:10px 12px;border:1px solid #e5eee7;border-radius:12px;font-size:11px;color:#719080}.record{display:flex;align-items:center;gap:8px;margin-top:12px;padding:12px;border:1px solid #dbe9df;border-radius:14px;background:#f7fbf8;font-size:10px;color:#7d9a85}.record svg{width:18px;height:18px;color:#7aaa8a}.detail{text-align:center;background:#fff;border-radius:25px;padding:25px 18px}.detail img{width:95px;height:95px;border-radius:50%;object-fit:cover}.detail h3{font-size:25px;font-weight:600;margin:15px 0 6px}.detail p{font-size:11px;color:#8da494;line-height:1.9}.detail .traits{justify-content:center}.conversation{margin-top:13px;background:#fff;border-radius:24px;padding:20px}.conversation h3{font-size:15px;font-weight:600;margin:0 0 18px}.bubble{display:inline-block;max-width:90%;background:#f0f7f2;border-radius:16px;padding:12px 14px;font-size:11px;line-height:1.8;color:#7b9485;margin-bottom:10px}.detail-buttons{display:flex;gap:9px}.detail-buttons .primary{flex:1}.secondary{border:1px solid var(--small-border);background:var(--small-fill);color:var(--accent);border-radius:24px;padding:0 14px;font-size:11px}.toast{position:absolute;bottom:89px;left:50%;transform:translateX(-50%);max-width:93%;padding:10px 14px;border-radius:12px;background:#405448ef;color:#fff;font-size:10px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s}.toast.visible{opacity:1}.footnote{font-size:10px;color:#98aa9d;text-align:center;line-height:1.9;margin:13px 0 0}
    @media(max-width:850px){.layout{gap:30px;grid-template-columns:minmax(0,1fr) 340px;padding:30px 22px}.samples{gap:8px}.variant{padding:15px}.sample-primary{font-size:10px}}@media(max-width:700px){.layout{display:flex;flex-direction:column;padding:27px 18px;gap:28px}.options{width:100%}.preview{position:static;width:100%;max-width:380px;margin:auto}.variants{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.variant{padding:13px 11px}.variant h2{font-size:12px}.variant p{font-size:9px;min-height:32px}.samples{flex-direction:column;align-items:stretch;gap:7px}.sample-primary{flex:none}.sample-secondary{justify-content:center}.tag{display:none}.phone{height:765px}h1{font-size:25px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}

<body>
  <svg class="symbols" aria-hidden="true"><defs>
    <symbol id="chat" viewBox="0 0 24 24"><path d="M21 11a9 9 0 0 1-9 9H7l-5 2 2-5a9 9 0 1 1 17-6Z"/><path d="M7 11h.01M12 11h.01M17 11h.01"/></symbol>
    <symbol id="plus" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></symbol>
    <symbol id="check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="back" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></symbol>
    <symbol id="phone" viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M10 18h4"/></symbol>
    <symbol id="lock" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="12" rx="3"/><path d="M8 10V6a4 4 0 0 1 8 0v4M12 15v3"/></symbol>
    <symbol id="camera" viewBox="0 0 24 24"><path d="M3 7h5l2-3h4l2 3h5v13H3Z"/><circle cx="12" cy="13" r="4"/></symbol>
    <symbol id="heart" viewBox="0 0 24 24"><path d="M12 21S2 15 2 8a5.7 5.7 0 0 1 10-3.4A5.7 5.7 0 0 1 22 8c0 7-10 13-10 13Z"/></symbol>
    <symbol id="leaf" viewBox="0 0 24 24"><path d="M22 2C10 1 2 7 3 14c.5 3.5 3 6 7 6C18 20 21 12 22 2ZM2 22 17 7"/></symbol>
    <symbol id="star" viewBox="0 0 24 24"><path d="m12 1 3.4 7 7.6 1.1-5.5 5.4 1.3 7.5-6.8-3.6L5.2 22l1.3-7.5L1 9.1 8.6 8Z"/></symbol>
    <symbol id="coffee" viewBox="0 0 24 24"><path d="M3 9h13v7a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4ZM16 10h2a3 3 0 1 1 0 6h-2M2 23h17M7 2v3M12 2v3"/></symbol>
    <symbol id="sparkle" viewBox="0 0 24 24"><path d="m10 3 2.5 6.5L19 12l-6.5 2.5L10 21l-2.5-6.5L1 12l6.5-2.5ZM20 2v5M17.5 4.5h5"/></symbol>
    <symbol id="wave" viewBox="0 0 24 24"><path d="M3 10v4M7.5 5v14M12 2v20M16.5 6v12M21 9v6"/></symbol>
    <symbol id="user" viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M4 22v-3a8 8 0 0 1 16 0v3"/></symbol>
    <symbol id="pen" viewBox="0 0 24 24"><path d="m16 3 5 5L8 21H3v-5Z"/></symbol>
    <symbol id="mic" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="13" rx="3"/><path d="M5 11v2a7 7 0 0 0 14 0v-2M12 20v3M8 23h8"/></symbol>
  </defs></svg>
  <main class="layout">
    <section class="options">
      <div class="eyebrow">BINGO · ONE BUTTON SYSTEM</div>
      <h1>不只换浅色，<br>这次统一按钮的质感。</h1>
      <p class="intro">保留 Bingo 的白色卡片、薄荷背景和图标。登录、注册、创建伙伴、进入聊天使用同一套主按钮；卡片里的「进入」保持轻量。头像上传仍是你选好的浅薄荷。</p>
      <div class="variants" id="variants" aria-label="四套新的按钮方案"></div>
      <p class="note">建议先看 <strong>01 清透青玉</strong>：不失品牌感，也没有旧深绿那么沉。<br>如果你希望完全摆脱大面积绿底，看看 <strong>02 青灰磨砂</strong> 或 <strong>03 白底轻描边</strong>。</p>
      <div class="original"><span>也可以在同一页面对比原深绿</span><button id="original" type="button">查看原配色</button></div>
      <a class="back-link" href="action-button-colors.html">返回上一组按钮方案</a>
    </section>
    <section class="preview" aria-label="全页面效果预览">
      <div class="preview-label"><span>一套方案，五个页面</span><strong id="current-label">01 · 清透青玉</strong></div>
      <nav class="pages" aria-label="预览页面"><button data-page="login" aria-pressed="true">登录</button><button data-page="register" aria-pressed="false">注册</button><button data-page="home" aria-pressed="false">陪伴空间</button><button data-page="create" aria-pressed="false">创建伙伴</button><button data-page="detail" aria-pressed="false">进入聊天</button></nav>
      <div class="phone" id="phone"><div class="screen"><div class="status" aria-hidden="true"><span>09:41</span><span>5G · 83%</span></div><div id="page-content"></div></div><div class="bottom" id="bottom" hidden></div><div class="toast" id="toast" role="status"></div></div>
      <p class="footnote">可切换页面，看整套效果；不是单个色块。<br>仅 HTML 预览，不登录、不注册、不写入真实数据。</p>
    </section>
  </main>
  <script>
    const logo = '../../apps/mobile/assets/images/bingo_logo.png';
    const icon = name => `<svg aria-hidden="true"><use href="#${name}"/></svg>`;
    const variants = [
      {name:'清透青玉',tag:'保留品牌感',description:'有一点青玉光泽，比旧深绿更清透，不用粉浅色。',fill:'linear-gradient(115deg,#78BFA6,#68B199)',ink:'#17392C',border:'#74B89F',accent:'#508672',small:'#EDF6F0',smallBorder:'#DBEADF',shadow:'0 5px 14px #609B7C15'},
      {name:'青灰磨砂',tag:'减轻绿底',description:'白卡片里放柔和青灰，深色文字，比纯浅绿更稳。',fill:'linear-gradient(115deg,#E5ECE6,#DCE6DE)',ink:'#486352',border:'#CDDBD0',accent:'#63866F',small:'#F0F5F0',smallBorder:'#DDE7DF',shadow:'0 3px 9px #52725508'},
      {name:'白底轻描边',tag:'最轻巧',description:'主按钮回到白色，细边框和绿色文字来表达可点击。',fill:'#FFFFFF',ink:'#577E65',border:'#AECAB6',accent:'#62866F',small:'#F5F9F5',smallBorder:'#DBE7DE',shadow:'0 3px 11px #69886D0B'},
      {name:'柔和青灰',tag:'更低饱和',description:'灰绿而不是浓绿，白字清晰，强调感适中。',fill:'linear-gradient(115deg,#61796A,#576E60)',ink:'#FFFFFF',border:'#61796A',accent:'#718B76',small:'#EFF4EF',smallBorder:'#DCE7DE',shadow:'0 5px 14px #52675110'},
    ];
    const roles = [
      {name:'甜甜',type:'女朋友',image:'girlfriend',description:'亲密、体贴的女性伴侣',unread:2,traits:[['主动关心','heart'],['温柔体贴','leaf'],['甜蜜互动','heart']]},
      {name:'暖暖',type:'男朋友',image:'boyfriend',description:'亲密、可靠的男性伴侣',unread:0,traits:[['安心陪伴','leaf'],['耐心倾听','chat'],['鼓励支持','star']]},
      {name:'小周',type:'同事',image:'colleague',description:'可靠且有边界感的工作伙伴',unread:3,traits:[['工作搭子','coffee'],['思路梳理','star'],['高效协作','leaf']]},
      {name:'小田老师',type:'老师',image:'teacher',description:'耐心讲解并帮助用户成长',unread:0,traits:[['耐心讲解','chat'],['成长引导','leaf'],['答疑解惑','star']]},
    ];
    const traitMarkup = role => `<div class="traits">${role.traits.map(([label,symbol])=>`<span class="trait ${symbol}">${icon(symbol)}${label}</span>`).join('')}</div>`;
    const phone = document.getElementById('phone');
    const holder = document.getElementById('variants');
    let page = 'login', toastTimer;
    function applyColors(element, variant) {
      for (const [name,value] of Object.entries({'button-fill':variant.fill,'button-ink':variant.ink,'button-border':variant.border,'accent':variant.accent,'small-fill':variant.small,'small-border':variant.smallBorder,'button-shadow':variant.shadow})) element.style.setProperty('--'+name,value);
    }
    function selectVariant(variant,index) {
      applyColors(phone,variant);
      document.getElementById('current-label').textContent = String(index+1).padStart(2,'0')+' · '+variant.name;
      for (const button of holder.querySelectorAll('button')) button.setAttribute('aria-pressed',String(Number(button.dataset.index)===index));
    }
    variants.forEach((variant,index)=>{
      const button = document.createElement('button'); button.type='button'; button.className='variant'; button.dataset.index=index;
      button.setAttribute('aria-pressed',String(index===0)); applyColors(button,variant);
      button.innerHTML=`<div class="variant-top"><h2>${String(index+1).padStart(2,'0')} · ${variant.name}</h2><span class="tag">${variant.tag}</span><span class="selection-check">${icon('check')}</span></div><p>${variant.description}</p><div class="samples"><span class="sample-primary">登录 / 注册</span><span class="sample-primary">${icon('plus')}创建伙伴</span><span class="sample-secondary">${icon('chat')}进入</span></div>`;
      button.addEventListener('click',()=>selectVariant(variant,index)); holder.append(button);
    });
    function notify(message) {const toast=document.getElementById('toast');toast.textContent=message;toast.classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('visible'),2300);}
    function header(title) {return `<header class="header"><button type="button" class="back" data-action="home" aria-label="返回陪伴空间">${icon('back')}</button><h2>${title}</h2><img class="user" src="${logo}" alt="用户头像"></header>`;}
    function renderPage() {
      const content=document.getElementById('page-content'),bottom=document.getElementById('bottom');bottom.hidden=true;bottom.innerHTML='';
      for (const button of document.querySelectorAll('[data-page]')) button.setAttribute('aria-pressed',String(button.dataset.page===page));
      if(page==='login'||page==='register'){
        const login=page==='login';
        content.innerHTML=`<section class="auth-content"><img class="auth-brand" src="${logo}" alt="Bingo"><h2 class="auth-title">${login?'你好，又见面了':'开启你的陪伴空间'}</h2><p class="auth-subtitle">${login?'在这里，日常可以慢慢分享。':'一点关心，一份陪伴，随时都在。'}</p><div class="auth-switch"><button type="button" data-action="login" aria-pressed="${login}">登录</button><button type="button" data-action="register" aria-pressed="${!login}">注册</button></div><form id="auth-form" novalidate><label class="field">${icon('phone')}<span>+86</span><input type="tel" placeholder="请输入手机号" aria-label="演示手机号" autocomplete="off"></label><label class="field">${icon('lock')}<input type="password" placeholder="${login?'请输入密码':'设置密码（至少 8 位）'}" aria-label="演示密码" autocomplete="off"></label>${login?'<button type="button" class="text-action forgot" data-toast="找回密码入口（仅配色演示）">忘记密码？</button>':'<p class="auth-subtitle" style="margin:15px 0 23px;font-size:10px">注册后，你可以完善自己的昵称、头像和生日。</p>'}<button class="primary" type="submit">${login?'登录':'注册'}</button><label class="terms"><input type="checkbox" aria-label="同意演示协议"><span>我已阅读并同意 <a href="#" data-toast="用户协议入口（仅演示）">用户协议</a> 和 <a href="#" data-toast="隐私政策入口（仅演示）">隐私政策</a></span></label></form><div class="auth-note"><span class="mini-line"></span>温柔陪伴，认真倾听<span class="mini-line"></span><br>Bingo，陪你度过平凡的一天</div></section>`;
        document.getElementById('auth-form').addEventListener('submit',event=>{event.preventDefault();notify('仅配色预览，不发送登录或注册请求');});
      } else if(page==='home'){
        content.innerHTML=`<header class="header"><img class="brand" src="${logo}" alt="Bingo"><h2>陪伴空间</h2><img class="user" src="${logo}" alt="用户头像"></header><div class="content">${roles.map(role=>`<article class="card"><div class="card-main"><img class="avatar" src="../../apps/mobile/assets/images/${role.image}.png" alt="${role.name}头像"><div class="info"><div class="card-heading"><h3>${role.name}</h3><span class="enter-wrap"><button class="enter" type="button" data-action="detail">${icon('chat')}进入</button>${role.unread?`<span class="unread">${role.unread}</span>`:''}</span></div><p class="subtitle">${role.type} · ${role.description}</p></div></div>${traitMarkup(role)}</article>`).join('')}</div>`;
        bottom.hidden=false;bottom.innerHTML=`<button class="primary" type="button" data-action="create">${icon('plus')}创建伙伴</button>`;
      } else if(page==='create'){
        content.innerHTML=header('创建伙伴')+`<div class="content"><div class="create-intro"><button class="avatar-upload" type="button" data-toast="头像上传按钮保持已选的浅薄荷"> <img src="${logo}" alt="Bingo 默认头像"><span class="camera">${icon('camera')}</span></button><span class="avatar-caption">更换头像</span><h3>让陪伴，有自己的样子</h3><p>一个名字，一份默契，一个熟悉的声音。</p></div><section class="panel"><h3>${icon('user')}伙伴昵称</h3><div class="input-preview">给 TA 起一个亲切的名字</div></section><section class="panel"><h3>${icon('pen')}伙伴设定</h3><div class="input-preview">TA 是谁？怎样说话？<br>你希望 TA 怎样陪伴你？</div></section><section class="panel"><h3>${icon('sparkle')}陪伴特征</h3>${traitMarkup(roles[0])}</section><section class="panel"><h3>${icon('wave')}伙伴声音</h3><div class="voice-tabs"><span class="active">系统音色</span><span>已有伙伴</span></div><div class="voice-select">甜甜<span>⌄</span></div><div class="record">${icon('mic')}录一段声音，让 TA 更熟悉</div></section></div>`;
        bottom.hidden=false;bottom.innerHTML=`<button class="primary" type="button" data-toast="创建伙伴按钮（仅配色演示，不写入账号）">创建伙伴</button>`;
      } else {
        content.innerHTML=header('伙伴详情')+`<div class="content"><section class="detail"><img src="../../apps/mobile/assets/images/girlfriend.png" alt="甜甜头像"><h3>甜甜</h3><p>女朋友 · 温柔陪伴</p>${traitMarkup(roles[0])}<p>愿意听你分享日常，也愿意陪你度过疲惫的时刻。</p></section><section class="conversation"><h3>最近对话</h3><div class="bubble">今天过得怎么样？</div><div class="bubble">如果有点累，我们就慢慢聊。</div></section></div>`;
        bottom.hidden=false;bottom.innerHTML=`<div class="detail-buttons"><button class="primary" type="button" data-toast="进入聊天按钮（仅配色演示）">${icon('chat')}进入聊天</button><button class="secondary" type="button" data-action="create">编辑伙伴</button></div>`;
      }
      document.querySelector('.screen').scrollTop=0;
    }
    document.addEventListener('click',event=>{
      const action=event.target.closest('[data-action]');if(action){page=action.dataset.action;renderPage();return;}
      const toast=event.target.closest('[data-toast]');if(toast){event.preventDefault();notify(toast.dataset.toast);}
    });
    for (const button of document.querySelectorAll('[data-page]')) button.addEventListener('click',()=>{page=button.dataset.page;renderPage();});
    document.getElementById('original').addEventListener('click',()=>{
      applyColors(phone,{fill:'linear-gradient(115deg,#08775D,#35A980)',ink:'#FFFFFF',border:'#08775D',accent:'#08775D',small:'#E9F7EF',smallBorder:'#D7ECE0',shadow:'0 6px 18px #08775D20'});
      document.getElementById('current-label').textContent='原深绿色 · 对比';for(const button of holder.querySelectorAll('button'))button.setAttribute('aria-pressed','false');
    });
    selectVariant(variants[0],0);renderPage();
  </script>
</body>
</html>
