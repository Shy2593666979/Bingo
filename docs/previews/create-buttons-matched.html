<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bingo · 两个创建按钮统一配色</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f0f4f1;color:#263b32;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif}button,select{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #527962;outline-offset:3px}[hidden]{display:none!important}.sprite{position:absolute;width:0;height:0;overflow:hidden}.studio{max-width:1190px;padding:32px 30px 50px;margin:auto}.brand{display:flex;gap:10px;align-items:center;font-size:13px;font-weight:750;letter-spacing:1px}.brand img{width:32px;height:32px}.brand small{margin-left:auto;font-weight:400;letter-spacing:0;color:#677b6f;font-size:11px}h1{font-size:32px;letter-spacing:-1px;margin:36px 0 13px;font-weight:650}.intro{font-size:13px;line-height:1.95;color:#63786b;max-width:740px;margin:0}.intro b{font-weight:650;color:#344e3e}.controls{display:flex;justify-content:space-between;gap:15px;align-items:center;margin:26px 0 25px;border-bottom:1px solid #dae5dd;padding-bottom:15px}.controls label{font-size:12px;color:#58715f}.controls select{border:1px solid #d6e3da;border-radius:10px;background:#fbfdfb;color:#344c3d;padding:9px 12px;margin-left:7px}.comparison{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:27px}.variant{--button-bg:#d7edde;--button-ink:#376a4a;--button-border:#b8d8c3;background:#f8fbf8;border:1px solid #dce6de;border-radius:25px;padding:20px;box-shadow:0 10px 24px #355b3e04;min-width:0}.variant-heading{display:flex;align-items:center;gap:9px;margin-bottom:17px}.letter{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--button-bg);color:var(--button-ink);font-size:12px;font-weight:750;border:1px solid var(--button-border)}.variant-heading h2{margin:0;font-size:15px;font-weight:700}.hint{margin-left:auto;font-size:10px;color:#63786b}.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.scene-label{font-size:10px;color:#6c8073;margin:0 3px 8px}.phone{height:354px;background:#f6fbf9;border:1px solid #e0e9e3;border-radius:22px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 5px 16px #34584005}.body{flex:1;min-height:0;padding:15px 12px;overflow:hidden}.space-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.space-head h3{font-size:16px;margin:0;letter-spacing:-.5px}.space-head p{font-size:8px;color:#71877a;margin:5px 0 0}.space-head img{width:28px;height:28px;object-fit:contain}.card{display:flex;gap:8px;align-items:center;background:#fff;border:1px solid #e6eee8;border-radius:17px;padding:11px 8px;margin-bottom:9px}.portrait{width:36px;height:36px;border-radius:50%;object-fit:cover;flex:none}.card h4{font-size:12px;margin:0 0 5px}.card p{font-size:8px;margin:0;color:#71877a;white-space:nowrap}.tags{display:flex;gap:4px;margin-top:6px}.tags span{font-size:7px;padding:3px 5px;border-radius:8px;background:#eef6f1;color:#547763}.enter{margin-left:auto;color:#41745d;background:#eef6f1;border-radius:12px;font-size:8px;padding:5px 7px;white-space:nowrap}.editor-title{display:grid;grid-template-columns:20px 1fr 20px;align-items:center;text-align:center;font-size:13px;font-weight:650;margin-bottom:10px}.icon{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block;flex:none}.editor-avatar{display:block;width:39px;height:39px;object-fit:contain;margin:10px auto 6px}.upload{width:fit-content;margin:0 auto 10px;padding:5px 9px;background:#edf6f0;border:1px solid #dbe9de;border-radius:8px;color:#53775e;font-size:8px}.field{margin-top:9px}.field label{font-size:8px;display:block;margin-bottom:5px;color:#435b4b}.input{border:1px solid #e1e9e3;background:#fff;border-radius:9px;padding:9px;font-size:9px;color:#789080}.input.textarea{height:45px;line-height:1.7}.voice{margin-top:9px;color:#607b6a;font-size:8px}.actions{padding:10px 11px 5px;background:#f6fbf9}.create{height:43px;width:100%;display:flex;justify-content:center;align-items:center;gap:6px;border-radius:24px;border:1px solid var(--button-border);background:var(--button-bg);color:var(--button-ink);font-size:12px;font-weight:700;padding:0 8px;box-shadow:none}.create .icon{width:18px;height:18px}.create:hover:not(:disabled){filter:brightness(.97)}.create:active:not(:disabled){filter:brightness(.93)}.create:disabled{opacity:.42;cursor:not-allowed}.homebar{width:59px;height:3px;border-radius:4px;background:#213e30;opacity:.15;margin:10px auto 7px}.details{display:flex;gap:12px;align-items:center;margin:14px 1px 0}.swatch{width:21px;height:21px;background:var(--button-bg);border:1px solid var(--button-border);border-radius:7px;flex:none}.details p{font-size:11px;color:#617867;line-height:1.8;margin:0}.details code{font-family:inherit;font-size:10px;letter-spacing:.2px;color:#6a7e70}.note{font-size:11px;color:#67816e;line-height:1.8;margin:10px 1px 0}.rules{margin-top:28px;padding:20px;border:1px solid #dce6de;border-radius:19px;background:#f9fcf9;font-size:12px;line-height:2;color:#63786b}.rules b{color:#344e3e}.feedback{min-height:18px;font-size:10px;color:var(--button-ink);margin:10px 1px 0;line-height:1.8}.footer{font-size:11px;color:#6a8072;line-height:1.9;margin-top:20px}@media(max-width:830px){.studio{padding:26px 18px}.comparison{gap:18px}.variant{padding:15px}.pair{gap:8px}.body{padding:13px 9px}.card{padding:9px 6px;gap:6px}.portrait{width:30px;height:30px}.enter{display:none}.hint{font-size:9px}.variant-heading{gap:6px}.variant-heading h2{font-size:13px}}@media(max-width:640px){.studio{max-width:550px;padding:24px 14px}h1{font-size:26px;line-height:1.5}.brand small{font-size:9px}.comparison{grid-template-columns:1fr}.variant{padding:17px}.portrait{width:36px;height:36px}.enter{display:block}.controls{align-items:flex-start;flex-direction:column;gap:10px}.phone{height:362px}.hint{font-size:10px}.variant-heading h2{font-size:15px}.intro{font-size:12px}}@media(max-width:370px){.variant{padding:12px}.enter{display:none}.portrait{width:29px;height:29px}.create{font-size:11px}.hint{font-size:9px}.space-head h3{font-size:14px}}@media(prefers-reduced-motion:no-preference){.create{transition:filter .15s ease}}
  </style>
</head>
<body>
  <svg class="sprite" aria-hidden="true"><defs><symbol id="plus" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></symbol><symbol id="back" viewBox="0 0 24 24"><path d="m14 5-7 7 7 7"/></symbol></defs></svg>
  <main class="studio">
    <header class="brand"><img src="assets/ui-kit/bingo_logo.png" alt="Bingo">BINGO<small>只看两个创建按钮 · 不换整页颜色</small></header>
    <h1>两个创建按钮，同一种颜色。</h1>
    <p class="intro">左边是<b>陪伴空间底部的创建入口</b>，右边是<b>创建页面底部的提交按钮</b>。每一组的背景、文字和边框颜色完全相同。页面和卡片保留现有浅绿风格，只比较按钮的六种绿。</p>
    <div class="controls"><label>对比方式<select id="filter"><option value="all">全部六组</option><option value="a">A · 现有浅绿统一</option><option value="b">B · 柔和薄荷</option><option value="c">C · 清透青绿</option><option value="d">D · 灰调叶绿</option><option value="e">E · 柔和湖绿</option><option value="f">F · 现有深绿统一</option></select></label><label>按钮状态<select id="state"><option value="normal">正常可点击</option><option value="disabled">暂不可点击</option></select></label></div>
    <section class="comparison" aria-label="六组统一创建按钮配色"></section>
    <div class="rules"><b>统一规则：</b>两个创建按钮共用同一套颜色，不再分别写深绿、浅绿。首页保留加号，提交按钮保留纯文字；形状与现有页面保持一致。<br><b>我的建议：</b>喜欢轻一点选 B；想要更明确的按钮感选 C；喜欢白字但又不想太浓选 D。</div>
    <p class="footer">这次只做按钮配色预览，未修改 App 按钮颜色，也不打包。你选定后再把两个按钮一起统一。</p>
  </main>
  <script>
    const variants = [
      {id:'a',name:'现有浅绿统一',hint:'轻柔 · 低存在感',bg:'#D7EDDE',ink:'#376A4A',border:'#B8D8C3',note:'沿用创建页现有浅绿，让首页按钮也变轻。'},
      {id:'b',name:'柔和薄荷',hint:'推荐 · 轻而不淡',bg:'#BFE5D4',ink:'#275C48',border:'#B0D7C5',note:'比现有浅绿稍饱满一点，两处都轻柔，不会显得像禁用。'},
      {id:'c',name:'清透青绿',hint:'推荐 · 层次适中',bg:'#92C8AF',ink:'#203F32',border:'#88BDA4',note:'在深绿和浅绿之间，按钮更明确，但没有现在的浓绿感。'},
      {id:'d',name:'灰调叶绿',hint:'白字 · 柔和克制',bg:'#527962',ink:'#FFFFFF',border:'#527962',note:'减少绿色的鲜艳感，用柔和的灰绿搭配白字。'},
      {id:'e',name:'柔和湖绿',hint:'白字 · 清爽稳定',bg:'#327E70',ink:'#FFFFFF',border:'#327E70',note:'带一点青色，既有主按钮感，也不显得沉重。'},
      {id:'f',name:'现有深绿统一',hint:'白字 · 品牌延续',bg:'#08775D',ink:'#FFFFFF',border:'#08775D',note:'采用项目主色的深绿，两处都统一成明显的主按钮。'}
    ];
    const icon = name => `<svg class="icon" aria-hidden="true"><use href="#${name}"/></svg>`;
    function partner(name, avatar, role, features) {
      return `<div class="card"><img class="portrait" src="assets/ui-kit/${avatar}.png" alt="${name}"><div><h4>${name}</h4><p>${role}</p><div class="tags">${features.map(text=>`<span>${text}</span>`).join('')}</div></div><span class="enter">进入</span></div>`;
    }
    const space = `<header class="space-head"><div><h3>陪伴空间</h3><p>在这里，慢慢聊~</p></div><img src="assets/ui-kit/bingo_logo.png" alt="用户头像"></header>${partner('甜甜','girlfriend','女朋友 · 温柔陪伴',['主动关心','温柔体贴'])}${partner('暖暖','boyfriend','男朋友 · 安心陪伴',['耐心倾听','鼓励支持'])}${partner('小周','colleague','同事 · 工作搭子',['思路梳理','高效协作'])}`;
    const editor = `<div class="editor-title">${icon('back')}<span>创建伙伴</span><span></span></div><img class="editor-avatar" src="assets/ui-kit/bingo_logo.png" alt="默认伙伴头像"><div class="upload">上传图片</div><div class="field"><label>伙伴昵称</label><div class="input">我的伙伴</div></div><div class="field"><label>伙伴角色</label><div class="input">朋友</div></div><div class="field"><label>伙伴设定</label><div class="input textarea">温柔、耐心，愿意听我慢慢说。</div></div><div class="voice">伙伴声音 · 甜甜</div>`;
    document.querySelector('.comparison').innerHTML = variants.map(variant => `<article class="variant" data-id="${variant.id}" style="--button-bg:${variant.bg};--button-ink:${variant.ink};--button-border:${variant.border}"><header class="variant-heading"><span class="letter">${variant.id.toUpperCase()}</span><h2>${variant.name}</h2><span class="hint">${variant.hint}</span></header><div class="pair">${[['陪伴空间 · 创建入口',space,true],['创建页面 · 提交按钮',editor,false]].map(([label,body,plus]) => `<div><p class="scene-label">${label}</p><div class="phone"><div class="body">${body}</div><div class="actions"><button class="create" data-action="${plus?'进入创建页面':'提交创建伙伴'}">${plus?icon('plus'):''}创建伙伴</button></div><div class="homebar"></div></div></div>`).join('')}</div><div class="details"><span class="swatch" aria-hidden="true"></span><p>${variant.note}<br><code>两处相同：背景 ${variant.bg} · 文字 ${variant.ink}</code></p></div><p class="feedback" role="status" aria-live="polite"></p></article>`).join('');
    document.querySelector('#filter').addEventListener('change',event=>{
      document.querySelectorAll('.variant').forEach(variant=>{variant.hidden=event.target.value!=='all'&&variant.dataset.id!==event.target.value;});
    });
    document.querySelector('#state').addEventListener('change',event=>{
      document.querySelectorAll('.create').forEach(button=>{button.disabled=event.target.value==='disabled';});
      document.querySelectorAll('.feedback').forEach(feedback=>{feedback.textContent='';});
    });
    document.addEventListener('click',event=>{
      const button=event.target.closest('.create');
      if(button)button.closest('.variant').querySelector('.feedback').textContent=`${button.dataset.action} · 仅样式预览，两处颜色保持一致。`;
    });
  </script>
</body>
</html>
