in-height:42px}.choose{width:100%;border:1px solid #d9e5d2;background:white;color:#6b8d70;border-radius:12px;padding:11px;font:inherit;font-size:12px;cursor:pointer}.selected .choose{border-color:#c9ddc0;background:#e4efdd;color:#57815a}button:focus-visible,a:focus-visible{outline:3px solid #8dc19c;outline-offset:4px}.footer{font-size:11px;color:#8c9b85;line-height:1.9;margin-top:25px}.footer a{color:#638f6d;text-decoration:none}.status{font-size:12px;color:#6c8f71;margin-top:24px}@media(max-width:760px){main{margin:28px auto;padding:0 18px}h1{font-size:24px}.grid{grid-template-columns:1fr;max-width:410px;margin:auto}.option{padding:21px}.note{min-height:0}.footer,.status{max-width:410px;margin-left:auto;margin-right:auto}}
  </style>
</head>
<body>
  <main><div class="eyebrow">BINGO · ICON DIRECTION 02</div><h1>不再给小人叠加符号。</h1><p class="intro">这次换成微软 Fluent 官方 SVG：更完整的轮廓、更明确的视觉重量。<br>颜色不变；同时给你一个完全不放图标的版本，看看哪一种更顺眼。</p><div class="grid" id="options"></div><p class="status" id="status" role="status">点击按钮标记喜欢的方案。</p><div class="footer">图标来源：<a href="https://github.com/microsoft/fluentui-system-icons" target="_blank" rel="noopener noreferrer">Microsoft Fluent System Icons</a>，保留原始形状，仅调整颜色与显示尺寸。<a href="assets/deletion-icons/FLUENT-LICENSE.txt">MIT 许可</a>。<br>只做 HTML 对比，不修改 APP，也不执行注销。<a href="bingo-account-deletion.html">查看原注销流程 →</a></div></main>

    };
    const choices = [
      {id:'A',title:'关闭符号',icon:'power',note:'一个完整的关闭符号，视觉最简洁；需要“注销账号”文字明确它不是退出登录。'},
      {id:'B',title:'实心删除箱',icon:'deletion',note:'比线框版更饱满，轮廓圆润，删除含义清楚。没有额外附加的小符号。'},
      {id:'C',title:'盾牌关闭',icon:'shield',note:'更偏账号安全，实心轮廓更稳；也可能被理解为安全功能关闭，文字仍很重要。'},
      {id:'D',title:'只留文字',icon:null,note:'入口不放图标，说明页也不放。让留白与文字承担层级，是最清爽的另一种方向。'}
    ];
    function icon(name) { return name ? `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[name]}"/></svg>` : ''; }
    document.querySelector('#options').innerHTML = choices.map(choice => `<article class="option" data-id="${choice.id}"><div class="heading"><span>${choice.id}</span><strong>${choice.title}</strong></div><div class="caption">设置中的注销入口</div><div class="row">${icon(choice.icon)}<div><strong>注销账号</strong><small>永久关闭账号与相关资料</small></div><svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></div><div class="page ${choice.icon ? '' : 'plain'}"><div class="caption">注销说明页</div>${choice.icon ? `<div class="hero-icon">${icon(choice.icon)}</div>` : ''}<h2>准备和 Bingo 告别吗？</h2><p>这不是退出登录。注销完成后，<br>原账号与以下内容将无法继续使用或恢复。</p></div><p class="note">${choice.note}</p><button class="choose" aria-pressed="false">选择 ${choice.id}</button></article>`).join('');
    document.querySelectorAll('.choose').forEach(button => button.addEventListener('click',() => {
      const selected = button.closest('.option');
      document.querySelectorAll('.option').forEach(option => {
        option.classList.toggle('selected',option === selected);
        option.querySelector('.choose').setAttribute('aria-pressed',String(option === selected));
      });
      document.querySelector('#status').textContent = `当前标记：${selected.dataset.id} · ${selected.querySelector('.heading strong').textContent}`;
    }));
  </script>
